services:
    database:
        image: postgres:${DB_VERSION:-15-alpine}
        container_name: postgres-backend-ambiental
        restart: always
        environment:
            POSTGRES_USER: ${DOCKER_USER:-postgres}
            POSTGRES_PASSWORD: ${DOCKER_PASSWORD:-postgres}
            POSTGRES_DB: ${DOCKER_DB:-postgres}
        ports:
            - '${DB_PORT:-5432}:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - backend

    loki:
        image: grafana/loki:3.3.0
        container_name: loki-ambiental
        restart: unless-stopped
        ports:
            - '${LOKI_PORT:-3100}:3100'
        command: -config.file=/etc/loki/local-config.yaml
        volumes:
            - ./loki.yaml:/etc/loki/local-config.yaml:ro
            - loki-data:/loki
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - logging

    alloy:
        image: grafana/alloy:v1.5.1
        container_name: alloy-ambiental
        restart: unless-stopped
        ports:
            - '${ALLOY_HTTP_PORT:-12345}:12345' # UI do Alloy
            - '${ALLOY_LOKI_PORT:-3101}:3101' # Receiver HTTP
        environment:
            - ENVIRONMENT=${NODE_ENV:-development}
        volumes:
            - ./config.alloy:/etc/alloy/config.alloy:ro
        command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
        # Health check removido - imagem Alloy não possui wget/curl
        # O serviço é monitorado via UI em :12345
        networks:
            - logging
        depends_on:
            loki:
                condition: service_healthy

    grafana:
        image: grafana/grafana:11.4.0
        container_name: grafana-ambiental
        restart: unless-stopped
        ports:
            - '${GRAFANA_PORT:-3001}:3000'
        environment:
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
            - GF_USERS_ALLOW_SIGN_UP=false
        volumes:
            - grafana-data:/var/lib/grafana
            - ./grafana-provisioning:/etc/grafana/provisioning:ro
        networks:
            - logging
        depends_on:
            loki:
                condition: service_healthy

volumes:
    pgdata:
    loki-data:
    grafana-data:

networks:
    backend:
        driver: bridge
    logging:
        driver: bridge
